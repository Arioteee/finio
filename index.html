<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Finio</title>

		<!-- FONTS -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@500,600,700,800,900&display=swap"
			rel="stylesheet"
		/>

		<!-- CSS -->
		<link rel="stylesheet" href="./styles/global.css" />
		<link rel="stylesheet" href="./styles/component.css" />
		<link rel="stylesheet" href="./styles/header.css" />
		<link rel="stylesheet" href="./styles/page.css" />
		<link rel="stylesheet" href="./styles/footer.css" />
	</head>
	<body>
		<header class="header">
			<div class="container">
				<div class="header__body">
					<div class="header__logo">
						<img
							src="./assets/icons/logotype.svg"
							alt="Логотип Finio"
							aria-label="Логотип сайта Finio"
							class="header__logo-img"
						/>
					</div>

					<nav class="header__nav" role="navigation">
						<ul class="header__menu">
							<li class="header__menu_item">
								<a href="#" class="header__menu_item-link">Возможности</a>
							</li>
							<li class="header__menu_item">
								<a href="#" class="header__menu_item-link active">
									Поддержка клиентов
								</a>
							</li>
							<li class="header__menu_item">
								<a href="#" class="header__menu_item-link">Тарифы</a>
							</li>
							<li class="header__menu_item">
								<a href="#" class="header__menu_item-link">Отзывы</a>
							</li>
						</ul>
					</nav>

					<div class="header__personalAcc">
						<a
							href="#"
							class="header__personalAcc-link white-primary-link"
							role="button"
							>Личный кабинет</a
						>
					</div>

					<button
						type="button"
						class="header__burgerMenu"
						aria-label="Кнопка открытия меню"
						role="navigation"
					>
						<img src="./assets/icons/menu-burger.svg" alt="Кнопка открытия меню" />
					</button>
				</div>
			</div>
		</header>

		<main class="main">
			<section class="hero">
				<div class="container container-visible">
					<div class="hero__body">
						<div class="hero__leftSide">
							<h1 class="hero__leftSide_title">
								Простой финансовый учёт для продавцов на маркетплейсах
							</h1>
							<a href="#" class="hero__leftSide_link white-primary-link">
								Попробовать 14 дней бесплатно
							</a>
							<div class="hero__companies">
								<div class="hero__companies_top">
									<img
										src="./assets/images/wb-logo.png"
										alt="Логотип Wildberries"
									/>
									<img src="./assets/images/ozon-logo.png" alt="Логотип Ozon" />
								</div>

								<div class="hero__companies_bottom">
									<img
										src="./assets/images/ymarket-logo.png"
										alt="Логотип Яндекс Маркет"
									/>
									<img
										src="./assets/images/aliexpress-logo.png"
										alt="Логотип Aliexpress"
									/>
								</div>
							</div>
						</div>
						<div class="hero__rightSide">
							<img
								src="./assets/images/hero-laptop.png"
								alt="Ноутбук с приложением"
							/>
						</div>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
